# Reference copy of the complete two-source configuration.
# The live file is written by `spolia setup` to the per-user config directory
# (~/.config/spolia/config.toml on Linux, ~/Library/Application Support/spolia/
# config.toml on macOS, %APPDATA%\spolia\config.toml on Windows). Prefer
# rerunning `spolia setup` (or `spolia setup --advanced`) over hand edits;
# direct edits apply on the next sync.
schema_version = 1
source_priority = ["openrouter", "zenmux"]

[schedule]
enabled = true
local_time = "09:00"

[sources.openrouter]
adapter = "openrouter"
credential_env = "OPENROUTER_API_KEY"

[sources.zenmux]
adapter = "zenmux"
credential_env = "ZENMUX_API_KEY"

[targets.kimi-code]
adapter = "kimi-code"

[jobs.openrouter-kimi-code]
enabled = true
source = "openrouter"
target = "kimi-code"
limit = 3
min_context = 131072

[jobs.openrouter-kimi-code.policy]
include_free = false

[jobs.zenmux-kimi-code]
enabled = true
source = "zenmux"
target = "kimi-code"
limit = 3
min_context = 131072

[jobs.zenmux-kimi-code.policy]
include_free = false
