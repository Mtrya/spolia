name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.sum
      - name: Prepare Linux user scheduler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          current_uid="$(id -u)"
          sudo loginctl enable-linger "$USER"
          sudo systemctl start "user@${current_uid}.service"
          echo "XDG_RUNTIME_DIR=/run/user/${current_uid}" >> "$GITHUB_ENV"
      - run: go test ./...
        env:
          LLMLOOT_NATIVE_SCHEDULE_TEST: "1"
      - run: go vet ./...
      - run: go build ./cmd/llmloot

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: go.sum
      - run: go test -race ./...
